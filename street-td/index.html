<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>まちかどオーケストラ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&text=%E3%81%BE%E3%81%A1%E3%81%8B%E3%81%A9%E3%82%AA%E3%83%BC%E3%82%B1%E3%82%B9%E3%83%88%E3%83%A9%E3%81%8A%E3%81%97%E3%81%84%E3%81%A4%E3%81%A5%E3%81%91%E3%82%8B%E3%82%BF%E3%82%A4%E3%83%AB%E3%81%B80123456789%3A.%E3%81%8D%E3%82%8D%E3%81%8F%E3%82%92%E3%81%99%E3%82%84%E3%82%81">
<link rel="stylesheet" href="css/m3.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="bg"></canvas>
    <div id="tray" class="m3-surface-container"></div>
    <canvas id="game"></canvas>

    <!-- ゲーム中の UI -->
    <div id="hud" hidden>
      <div id="gauge" class="m3-linear-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div class="track"><div class="indicator"></div></div>
        <div class="next"><img alt=""></div>
      </div>
      <div id="timer" class="m3-chip"><svg class="ic" viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61 1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.962 8.962 0 0 0 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg><span class="t">0:00.0</span></div>
      <div id="hudbest" class="m3-chip" hidden><svg class="ic crown" viewBox="0 0 24 24"><path d="M5 16 3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg><span class="t"></span></div>
      <button id="pause" class="m3-icon-button" aria-label="ながおしで いちじていし">
        <svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18"/></svg>
        <svg class="icon" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
    </div>

    <!-- タイトル -->
    <div id="title">
      <div class="logo m3-surface-container-high">
        <span class="notes">♪</span>
        <h1>まちかど<br>オーケストラ</h1>
        <div id="titlebest" class="m3-chip" hidden><svg class="ic crown" viewBox="0 0 24 24"><path d="M5 16 3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg><span class="t"></span></div>
        <span class="notes r">♫</span>
      </div>
      <div class="start">
        <div class="m3-circular-progress" id="loading"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20"/></svg></div>
        <div class="tap" id="tapcue" hidden><span class="ripple"></span><span class="ripple d2"></span>
          <svg viewBox="0 0 24 24"><path d="M9 11.24V7.5a2.5 2.5 0 0 1 5 0v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.91-1.38z"/></svg>
        </div>
      </div>
    </div>

    <!-- 一時停止のダイアログ（保護者向け） -->
    <div id="pausedlg" class="m3-scrim" hidden>
      <div class="m3-dialog" role="dialog" aria-modal="true">
        <svg class="dlg-icon" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        <div class="dlg-sub"><button class="m3-button text danger icon" id="openReset"><svg class="ic" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>きろくをけす</button></div>
        <div class="dlg-actions">
          <button class="m3-button text" id="toTitle">タイトルへ</button>
          <button class="m3-button filled" id="resume">つづける</button>
        </div>
      </div>
    </div>

    <!-- 最高記録を消す確認（保護者向け） -->
    <div id="resetdlg" class="m3-scrim" hidden>
      <div class="m3-dialog" role="alertdialog" aria-modal="true">
        <svg class="dlg-icon crown" viewBox="0 0 24 24"><path d="M5 16 3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
        <div class="dlg-best"><div id="resetbest" class="m3-chip big"><svg class="ic crown" viewBox="0 0 24 24"><path d="M5 16 3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg><span class="t"></span></div></div>
        <div class="dlg-actions">
          <button class="m3-button text" id="cancelReset">やめる</button>
          <button class="m3-button filled danger" id="doReset">けす</button>
        </div>
      </div>
    </div>

    <!-- おしまい（集合写真） -->
    <div id="photo" class="m3-scrim" hidden>
      <div class="m3-card photo-card">
        <canvas id="photocanvas" width="640" height="560"></canvas>
        <h2>おしまい</h2>
        <div class="result">
          <div id="restime" class="m3-chip big"><svg class="ic" viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61 1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.962 8.962 0 0 0 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg><span class="t"></span></div>
          <div id="resbest" class="m3-chip big"><svg class="ic crown" viewBox="0 0 24 24"><path d="M5 16 3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg><span class="t"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
