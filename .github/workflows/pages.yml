name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (元素材・加工スクリプト・設定ファイルは公開しない)
        run: |
          mkdir -p _site
          tar -cf - --exclude='./.git' --exclude='./.github' --exclude='./_site' \
            --exclude='./source' --exclude='*/tools' --exclude='*.md' . | tar -xf - -C _site
          # キャッシュ対策：CSS / JS の URL にコミットごとのバージョンを付ける
          V="${GITHUB_SHA::8}"
          find _site -name '*.html' -exec sed -i -E "s#(href|src)=\"((css|js)/[^\"?]+\.(css|js))\"#\1=\"\2?v=$V\"#g" {} +
          find _site -name '*.js' -exec sed -i -E "s#(from '\./[^'?]+\.js)'#\1?v=$V'#g" {} +
          grep -rn "?v=" _site --include='*.html' --include='*.js' | head -20
          touch _site/.nojekyll
          du -sh _site
          find _site -maxdepth 2 | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
